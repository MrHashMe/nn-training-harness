<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">nn-training harness</title>
  <desc id="d">Let an AI coding agent train your neural networks, and trust what it reports. Four pieces: a procedure, a guard, run records and a journal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="24" fill="url(#bg)" stroke="#ddd6fe" stroke-width="2"/>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="72" y="124" font-size="54" font-weight="700" fill="#1f2937">nn-training harness</text>
    <text x="72" y="178" font-size="26" fill="#4b5563">Let an AI coding agent train your neural</text>
    <text x="72" y="214" font-size="26" fill="#4b5563">networks, and trust what it reports.</text>
    <text x="72" y="266" font-size="18" fill="#6b7280">Plain files in your repository · Claude Code, Codex and Cursor</text>
    <g font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">
      <rect x="840" y="84" width="180" height="60" rx="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="930" y="121">a procedure</text>
      <rect x="1036" y="84" width="180" height="60" rx="30" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="1126" y="121">a guard</text>
      <rect x="840" y="176" width="180" height="60" rx="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="930" y="213">run records</text>
      <rect x="1036" y="176" width="180" height="60" rx="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="1126" y="213">a journal</text>
    </g>
  </g>
</svg>
